<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128" fill="none">
  <defs>
    <linearGradient id="lg1" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#3B82F6"/>
      <stop offset="100%" stop-color="#38BDF8"/>
    </linearGradient>
    <linearGradient id="lg2" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#38BDF8"/>
      <stop offset="100%" stop-color="#2563EB"/>
    </linearGradient>
    <linearGradient id="lg3" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#60A5FA"/>
      <stop offset="100%" stop-color="#3B82F6"/>
    </linearGradient>
    <filter id="glow">
      <feGaussianBlur stdDeviation="3" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
    <filter id="softGlow">
      <feGaussianBlur stdDeviation="6" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <!-- Background circle (soft glow) -->
  <circle cx="64" cy="64" r="56" fill="#0A0F1F" stroke="rgba(59,130,246,.15)" stroke-width="1" opacity=".8"/>
  <circle cx="64" cy="64" r="48" fill="#0E1428" stroke="rgba(59,130,246,.08)" stroke-width=".5"/>

  <!-- Nuqta (dot) — the focal point -->
  <circle cx="64" cy="64" r="12" fill="url(#lg2)" filter="url(#glow)" opacity=".95"/>
  <circle cx="64" cy="64" r="5" fill="#fff" opacity=".85"/>

  <!-- E curve — elegant swoop around the dot -->
  <path d="M38 40c12-8 28-8 40 0s16 20 16 32-4 24-16 32-28 8-40 0"
        stroke="url(#lg1)" stroke-width="2.5" stroke-linecap="round" fill="none"
        opacity=".7" filter="url(#softGlow)"/>

  <!-- Inner curve detail -->
  <path d="M44 48c8-5 20-5 28 0s12 16 12 26-2 18-12 24-20 5-28 0"
        stroke="url(#lg3)" stroke-width="1.2" stroke-linecap="round" fill="none"
        opacity=".5"/>

  <!-- Accent arc -->
  <path d="M80 36c16 6 26 18 26 32"
        stroke="rgba(56,189,248,.3)" stroke-width="1" stroke-linecap="round" fill="none"
        stroke-dasharray="4 4" opacity=".6"/>

  <!-- Small decorative dots -->
  <circle cx="38" cy="40" r="1.5" fill="#38BDF8" opacity=".5"/>
  <circle cx="90" cy="90" r="2" fill="#3B82F6" opacity=".4"/>
  <circle cx="38" cy="90" r="1" fill="#60A5FA" opacity=".3"/>
  <circle cx="90" cy="36" r="1.5" fill="#38BDF8" opacity=".35"/>
</svg>
