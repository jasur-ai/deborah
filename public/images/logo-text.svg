<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 480 120" fill="none" role="img" aria-label="Deborah">
  <!-- Deborah vintage wordmark — 'DEBORAH' oltin, davomi (tagline) yo'q.
       Eski "Edikit — INTERACTIVE PLATFORM" (cobalt) o'rniga premium vintage. -->
  <defs>
    <linearGradient id="goldText" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#C9A065"/>
      <stop offset="55%" stop-color="#E3C98F"/>
      <stop offset="100%" stop-color="#B98E4F"/>
    </linearGradient>
  </defs>

  <!-- Soya (depth) -->
  <text x="80" y="76" font-family="Georgia, 'Times New Roman', serif" font-size="48" font-weight="600" letter-spacing="13" fill="rgba(0,0,0,.35)">DEBORAH</text>

  <!-- Asosiy matn -->
  <text x="78" y="74" font-family="Georgia, 'Times New Roman', serif" font-size="48" font-weight="600" letter-spacing="13" fill="url(#goldText)">DEBORAH</text>

  <!-- Pastki oltin chiziq -->
  <line x1="112" y1="94" x2="368" y2="94" stroke="rgba(201,160,101,.55)" stroke-width="1.5" stroke-linecap="round"/>
  <circle cx="112" cy="94" r="2.2" fill="#C9A065" opacity=".8"/>
  <circle cx="368" cy="94" r="2.2" fill="#C9A065" opacity=".8"/>
</svg>
