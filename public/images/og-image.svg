<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630" fill="none">
  <defs>
    <!-- Background gradient -->
    <linearGradient id="bgGrad" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#05080F"/>
      <stop offset="50%" stop-color="#0A0F1F"/>
      <stop offset="100%" stop-color="#0E1428"/>
    </linearGradient>

    <!-- Accent gradient -->
    <linearGradient id="acc1" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#3B82F6"/>
      <stop offset="100%" stop-color="#38BDF8"/>
    </linearGradient>
    <linearGradient id="acc2" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#38BDF8"/>
      <stop offset="100%" stop-color="#2563EB"/>
    </linearGradient>
    <linearGradient id="acc3" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#60A5FA"/>
      <stop offset="100%" stop-color="#3B82F6"/>
    </linearGradient>
    <linearGradient id="textGrad" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#E8EDF7"/>
      <stop offset="100%" stop-color="#B0B9CE"/>
    </linearGradient>

    <!-- Glow filters -->
    <filter id="glow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="6" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
    <filter id="softGlow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="12" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
    <filter id="bigGlow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="25" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <!-- Background -->
  <rect width="1200" height="630" fill="url(#bgGrad)"/>

  <!-- Ambient glow orbs -->
  <circle cx="250" cy="315" r="280" fill="rgba(59,130,246,.06)" filter="url(#bigGlow)"/>
  <circle cx="950" cy="315" r="220" fill="rgba(56,189,248,.04)" filter="url(#bigGlow)"/>
  <circle cx="600" cy="100" r="150" fill="rgba(99,102,241,.03)" filter="url(#bigGlow)"/>

  <!-- Subtle grid pattern -->
  <g opacity=".03">
    <line x1="0" y1="105" x2="1200" y2="105" stroke="#fff" stroke-width=".5"/>
    <line x1="0" y1="210" x2="1200" y2="210" stroke="#fff" stroke-width=".5"/>
    <line x1="0" y1="315" x2="1200" y2="315" stroke="#fff" stroke-width=".5"/>
    <line x1="0" y1="420" x2="1200" y2="420" stroke="#fff" stroke-width=".5"/>
    <line x1="0" y1="525" x2="1200" y2="525" stroke="#fff" stroke-width=".5"/>
    <line x1="200" y1="0" x2="200" y2="630" stroke="#fff" stroke-width=".5"/>
    <line x1="400" y1="0" x2="400" y2="630" stroke="#fff" stroke-width=".5"/>
    <line x1="600" y1="0" x2="600" y2="630" stroke="#fff" stroke-width=".5"/>
    <line x1="800" y1="0" x2="800" y2="630" stroke="#fff" stroke-width=".5"/>
    <line x1="1000" y1="0" x2="1000" y2="630" stroke="#fff" stroke-width=".5"/>
  </g>

  <!-- Decorative accent line -->
  <line x1="0" y1="310" x2="90" y2="310" stroke="url(#acc1)" stroke-width="2" opacity=".4"/>
  <line x1="0" y1="320" x2="60" y2="320" stroke="rgba(56,189,248,.3)" stroke-width="1" opacity=".3"/>
  <line x1="1110" y1="310" x2="1200" y2="310" stroke="url(#acc1)" stroke-width="2" opacity=".4"/>
  <line x1="1140" y1="320" x2="1200" y2="320" stroke="rgba(56,189,248,.3)" stroke-width="1" opacity=".3"/>

  <!-- Large Nuqta+E Logo Mark -->
  <g transform="translate(220, 170)">
    <!-- Outer ring glow -->
    <circle cx="140" cy="145" r="130" fill="rgba(59,130,246,.03)" filter="url(#bigGlow)"/>

    <!-- Background circle -->
    <circle cx="140" cy="145" r="120" fill="#0E1428" stroke="rgba(59,130,246,.1)" stroke-width="1.5"/>
    <circle cx="140" cy="145" r="105" fill="#111A35" stroke="rgba(59,130,246,.06)" stroke-width="1"/>

    <!-- Big central dot (the heart of the mark) -->
    <circle cx="140" cy="145" r="28" fill="url(#acc2)" filter="url(#glow)" opacity=".95"/>
    <circle cx="140" cy="145" r="12" fill="#fff" opacity=".85"/>

    <!-- Large E-curve -->
    <path d="M70 80c30-20 70-20 100 0s40 50 40 75-10 55-40 75-70 20-100 0"
          stroke="url(#acc1)" stroke-width="6" stroke-linecap="round" fill="none"
          opacity=".65" filter="url(#softGlow)"/>

    <!-- Inner curve detail -->
    <path d="M86 100c20-14 48-14 68 0s24 36 24 55-4 42-24 56-48 14-68 0"
          stroke="url(#acc3)" stroke-width="3" stroke-linecap="round" fill="none"
          opacity=".45"/>

    <!-- Orbiting decorative dots -->
    <circle cx="70" cy="80" r="4" fill="#38BDF8" opacity=".5" filter="url(#glow)"/>
    <circle cx="212" cy="218" r="5" fill="#3B82F6" opacity=".4" filter="url(#glow)"/>
    <circle cx="70" cy="218" r="3" fill="#60A5FA" opacity=".3"/>
    <circle cx="212" cy="80" r="4" fill="#38BDF8" opacity=".35"/>
  </g>

  <!-- Deborah Text -->
  <text x="520" y="250" font-family="'Righteous', 'Segoe UI', system-ui, sans-serif"
        font-size="96" font-weight="700" letter-spacing="-1" fill="url(#textGrad)"
        filter="drop-shadow(0 4px 20px rgba(0,0,0,.5))">
    Edi<tspan fill="url(#acc1)" filter="url(#glow)">k</tspan>it
  </text>

  <!-- Subtitle -->
  <text x="520" y="310" font-family="'Nunito', system-ui, sans-serif"
        font-size="28" font-weight="500" fill="#64748B" letter-spacing="12">
    INTERACTIVE PLATFORM
  </text>

  <!-- Tagline -->
  <text x="520" y="380" font-family="'Nunito', system-ui, sans-serif"
        font-size="16" font-weight="400" fill="#8B96B3" letter-spacing="3">
    Real-time multiplayer quiz platform
  </text>

  <!-- Bottom accent bar -->
  <rect x="0" y="625" width="1200" height="5" fill="url(#acc1)" opacity=".6"/>

  <!-- Corner accents -->
  <path d="M40 40h40" stroke="rgba(56,189,248,.15)" stroke-width="1" opacity=".5"/>
  <path d="M40 40v40" stroke="rgba(56,189,248,.15)" stroke-width="1" opacity=".5"/>
  <path d="M1160 40h-40" stroke="rgba(56,189,248,.15)" stroke-width="1" opacity=".5"/>
  <path d="M1160 40v40" stroke="rgba(56,189,248,.15)" stroke-width="1" opacity=".5"/>
  <path d="M1160 590h-40" stroke="rgba(56,189,248,.15)" stroke-width="1" opacity=".5"/>
  <path d="M1160 590v-40" stroke="rgba(56,189,248,.15)" stroke-width="1" opacity=".5"/>
  <path d="M40 590h40" stroke="rgba(56,189,248,.15)" stroke-width="1" opacity=".5"/>
  <path d="M40 590v-40" stroke="rgba(56,189,248,.15)" stroke-width="1" opacity=".5"/>
</svg>
