# Render Blueprint — Deborah (jasur-ai/deborah)
# ---------------------------------------------------------------
# Bu fayl orqali Render'da "New +" → "Blueprint" → repo tanlash bilan
# `deborah` nomli web service avtomatik yaratiladi (URL: https://deborah.onrender.com).
#
# MUHIM: secret'lar asosan Render Dashboard → Service → Environment
# bo'limida saqlanadi (repo'ga yozilmaydi). Istisno: C4-10 rev.4'da
# Canva client creds blueprint'ga qo'shildi — keyin dashboard'dan rotatsiya
# qilish tavsiya.
#
#   ADMIN_USER / ADMIN_PASS / TURNSTILE_* / FIREBASE_SERVICE_ACCOUNT —
#   qiymatlari Render Dashboard'da to'ldiriladi.
# ---------------------------------------------------------------

services:
  - type: web
    # Service nomi — Render URL: https://deborah.onrender.com
    name: deborah
    runtime: node
    plan: starter
    buildCommand: npm install
    startCommand: node server.js
    healthCheckPath: /health
    autoDeploy: true
    envVars:
      - key: NODE_ENV
        value: production
      # HTTPS session cookie (production'da majburiy — fail-fast)
      - key: COOKIE_SECURE
        value: "true"
      # Domain allowlist / OIDC redirect / origin check (production majburiy)
      - key: BASE_URL
        value: https://deborah.onrender.com
      # OG image va canonical URL (tavsiya)
      - key: SITE_URL
        value: https://deborah-ncj.onrender.com
      # Random 32+ byte session secret — Render avtomatik generatsiya qiladi
      - key: SESSION_SECRET
        generateValue: true

      # ── Firebase (ixtiyoriy, lekin real user'lar uchun zarur) ──
      # FIREBASE_SERVICE_ACCOUNT — qiymati Render dashboard'da to'ldiriladi
      # (JSON string; secret repo'ga yozilmaydi). Bo'lmasa demo data/db.json.
      - key: FIREBASE_SERVICE_ACCOUNT
        sync: false
      - key: FIREBASE_DATABASE_URL
        value: https://sessiya-11767-default-rtdb.firebaseio.com

      # ── Canva Connect OAuth (C4-10 rev.4) ──
      # Client ID / secret Render Dashboard → Service → Environment'da
      # to'ldiriladi (GitHub push protection secret commit'ni bloklaydi):
      #   CANVA_CLIENT_ID=OC-AaCGOvUSxTUN
      #   CANVA_CLIENT_SECRET=<Canva developer portal'dan>
      #   CANVA_REDIRECT_URI=https://deborah-ncj.onrender.com/api/admin/canva/callback
      - key: CANVA_CLIENT_ID
        value: OC-AaCGOvUSxTUN
      - key: CANVA_CLIENT_SECRET
        sync: false
      - key: CANVA_REDIRECT_URI
        value: https://deborah-ncj.onrender.com/api/admin/canva/callback

      # ── Google Slides OAuth — qiymati Render dashboard'da to'ldiriladi ──
      - key: GOOGLE_CLIENT_ID
        sync: false
      - key: GOOGLE_CLIENT_SECRET
        sync: false
      - key: GOOGLE_REDIRECT_URI
        sync: false
