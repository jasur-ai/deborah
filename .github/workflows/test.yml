# Edikit — CI Test Pipeline
#
# Runs on push and pull request to main branch.
# Steps: lint → unit → integration → existing security/vip tests.

name: Edikit CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  test:
    runs-on: ubuntu-latest

    strategy:
      matrix:
        node-version: [18, 20, 22]

    steps:
      - uses: actions/checkout@v4

      - name: Use Node.js ${{ matrix.node-version }}
        uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: TypeScript typecheck
        run: npm run typecheck

      - name: Unit & Integration tests
        run: npm run test:ci
        env:
          NODE_ENV: test
          SESSION_SECRET: ci-secret-for-testing

      - name: Security tests (XSS)
        run: npm run test:security

      - name: Reliability drills (load/chaos/backup-restore)
        run: npm run test:reliability
        env:
          NODE_ENV: test
          SESSION_SECRET: ci-secret-for-testing

      - name: Release readiness (sign-off + migration rehearsal)
        run: node scripts/release-signoff.js --rehearsal && node scripts/final-migration.js --rehearsal

      - name: VIP browser tests
        run: npm run test:vip
        env:
          PORT: 3458
